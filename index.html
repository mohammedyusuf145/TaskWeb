<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08101F" />
    <meta name="description" content="Mizan — tasks, focus time and an AI tutor in one study system." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mizan · ميزان</title>
    <script>
      // Set theme and direction before first paint to avoid a flash.
      (function () {
        try {
          var lang = localStorage.getItem('mizan.lang') || 'ar';
          var pref = localStorage.getItem('mizan.theme') || 'dark';
          var dark = pref === 'dark' || (pref === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
          var h = document.documentElement;
          h.lang = lang;
          h.dir = lang === 'ar' ? 'rtl' : 'ltr';
          h.dataset.theme = dark ? "dark" : "light";
          var acc = localStorage.getItem("mizan.accent"); if (acc && acc !== "gold") h.dataset.accent = acc;
          if (localStorage.getItem("mizan.motion") === "reduce") h.dataset.motion = "reduce";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
